<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Historias</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        /* Estilos personalizados para mantener la estética de tus cajas con borde marcado */
        .caja-custom {
            border: 2px solid #212529;
            border-radius: 8px;
            background-color: #ffffff;
            transition: transform 0.2s;
        }
        .caja-custom:hover {
            transform: translateY(-2px);
            background-color: #f1f3f5;
        }
    </style>
</head>
<body class="d-flex justify-content-center align-items-center vh-100">

    <div class="container" style="max-width: 450px;">
        <!-- Contenedor principal con borde -->
        <div class="p-4 caja-custom shadow-sm">
            
            <!-- Caja superior: Nuevo Capítulo -->
            <div class="p-4 mb-4 text-center caja-custom bg-light">
                <h2 class="h4 fw-bold m-0 text-dark">NUEVO CAPÍTULO</h2>
            </div>

            <!-- Cajas inferiores: Capítulos (Distribuidas en columnas con Bootstrap Grid) -->
            <div class="row g-2">
                <div class="col">
                    <div class="p-2 text-center caja-custom fw-bold text-dark" role="button">
                        Cap 1
                    </div>
                </div>
                <div class="col">
                    <div class="p-2 text-center caja-custom fw-bold text-dark" role="button">
                        Cap 2
                    </div>
                </div>
                <div class="col">
                    <div class="p-2 text-center caja-custom fw-bold text-dark" role="button">
                        Cap 3
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap JS Bundle (opcional por si quieres agregar interactividad después) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
